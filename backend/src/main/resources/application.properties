spring.application.name=demo-drug
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_drug_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
logging.level.root=info
server.port=${SERVER_PORT:8081}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173}
app.security.token-secret=${TOKEN_SECRET:hospital-drug-local-dev-secret-change-me}
app.security.token-expire-hours=${TOKEN_EXPIRE_HOURS:12}
