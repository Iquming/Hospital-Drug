spring.application.name=hospital-drug-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_drug_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
logging.level.root=info
server.port=${SERVER_PORT:8081}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
app.security.token-secret=${TOKEN_SECRET:hospital-drug-local-dev-secret-change-me}
app.security.token-expire-hours=${TOKEN_EXPIRE_HOURS:12}
app.his.mode=${HIS_MODE:mock}
app.his.api-key=${HIS_API_KEY:his-demo-key}
app.his.status-callback-url=${HIS_STATUS_CALLBACK_URL:http://127.0.0.1:8090/api/his/drug-application-status}
app.his.connect-timeout-ms=${HIS_CONNECT_TIMEOUT_MS:3000}
app.his.read-timeout-ms=${HIS_READ_TIMEOUT_MS:5000}
app.his.callback-poll-ms=${HIS_CALLBACK_POLL_MS:5000}
app.his.callback-enabled=${HIS_CALLBACK_ENABLED:true}
app.his.callback-processing-timeout-seconds=${HIS_CALLBACK_PROCESSING_TIMEOUT_SECONDS:120}
app.his.allow-insecure-http=${HIS_ALLOW_INSECURE_HTTP:false}
app.his.signature-max-skew-seconds=${HIS_SIGNATURE_MAX_SKEW_SECONDS:300}
